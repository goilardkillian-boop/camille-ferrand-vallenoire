# Publie le dossier site/ sur GitHub Pages à chaque envoi sur main.
# Réglage GitHub : Settings > Pages > Source : GitHub Actions.
# Aucune étape de build : les fichiers sont publiés tels quels
# (les notes internes .md ne sont pas publiées).
name: Publier le site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer les fichiers publiés
        run: |
          mkdir -p _site
          cp -R site/. _site/
          find _site -name '*.md' -delete
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
